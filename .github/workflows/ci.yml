name: CI

on:
  push:
  pull_request:

jobs:
  build-unix:
    strategy:
      fail-fast: false            # <— keep Linux running even if macOS fails
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux: install Nix normally
      - name: Install Nix (Linux)
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # macOS: Java 25 directly
      - name: Setup Java 25 (Zulu) on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Cache Maven repo
        if: runner.os != 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      # Optional: warm the dev shell so we see Nix errors early
      - name: Warm Nix dev shell (Linux)
        if: runner.os == 'Linux'
        run: nix develop -L --accept-flake-config -c true

      - name: Build (Linux via Nix dev shell)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: nix develop -L --accept-flake-config -c bash -lc 'mvn -B clean verify'

      - name: Build (macOS without Nix)
        if: runner.os == 'macOS'
        env:
          MAVEN_OPTS: -Djava.awt.headless=true
        run: mvn -B clean verify

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: mvn -B -Pmac -DskipTests -Dmacosappbundler.dmg.enabled=false package

      - name: Create distributable ZIP
        if: runner.os == 'macOS'
        run: |
          cd target
          ditto -c -k --sequesterRsrc --keepParent "Zettelkasten.app" "Zettelkasten-macOS.zip"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 25 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package
